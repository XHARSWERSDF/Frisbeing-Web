<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game &middot; FRISBEING UF</title>
<meta name="description" content="See who is joining, sign up for today's or tomorrow's session, and find your team.">
<meta name="theme-color" content="#0E2018">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/monogram.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- ?v= matches CACHE in sw.js. The old sorter's script is still in phones'
     caches, and it cannot run this page: a URL that cache has never seen is
     fetched fresh instead. Bump both together when these files change. -->
<link rel="stylesheet" href="assets/brand.css?v=165">
</head>
<body data-background-emblem="false">

<div class="wrap">

  <nav class="nav">
    <div class="mark">
      <img src="assets/monogram.png" alt="">
      <div class="mark-copy">
        <span>FRISBEING UF</span>
        <small class="mark-est">Est. 2022</small>
      </div>
    </div>
    <a class="lnk" href="index.html">Home</a>
    <a class="lnk" id="gameNav" href="sort.html" aria-current="page" hidden>Game</a>
    <a class="lnk" id="membershipNav" href="roster.html">Member</a>
    <a class="lnk" id="accountNav" href="admin.html">Account</a><div class="nav-member-tools" id="memberTools" hidden><a class="lnk" href="gearhub.html">GearHub</a></div>
  </nav>

  <!-- tonight: what every player sees ------------------------------------ -->
  <section class="band-field tonight-band">
    <div class="inner">
      <div class="tonight" id="tonight" aria-live="polite">
        <p class="tn-small">Checking tonight&hellip;</p>
      </div>
      <div class="session-attendance" id="todayParticipants" aria-live="polite" hidden></div>
    </div>
  </section>

  <section class="band-field upcoming-band" id="upcomingBand" hidden>
    <div class="inner">
      <div class="upcoming-session" id="upcoming" aria-live="polite"></div>
    </div>
  </section>

  <!-- leaders and admins: the calendar and the draw ----------------------- -->
  <section class="band-green" id="leaderBand" hidden>
    <div class="inner">
      <div class="head">
        <h2 class="display">Sessions</h2>
        <div class="slashes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="cal-top">
        <div>
          <h3 class="cal-month" id="calMonth">&nbsp;</h3>
          <p class="cal-sub" id="calSub">&nbsp;</p>
        </div>
        <div class="cal-nav">
          <button class="pill round" id="calPrev" type="button" aria-label="Previous month">&lsaquo;</button>
          <button class="pill" id="calToday" type="button">Today</button>
          <button class="pill round" id="calNext" type="button" aria-label="Next month">&rsaquo;</button>
        </div>
      </div>

      <div class="cal-card">
        <div class="cal-grid" id="calGrid" aria-label="Session calendar"></div>
        <div class="cal-legend">
          <span class="k">KEY</span>
          <span><i class="dot regular"></i>Tue &amp; Thu</span>
          <span><i class="dot extra"></i>Extra session</span>
          <span><i class="dot drawn"></i>Teams drawn</span>
          <span><i class="dot today"></i>Today</span>
        </div>
      </div>

      <div class="day-panel" id="dayPanel" aria-live="polite"></div>

      <div style="text-align:center">
        <button class="tiers-toggle" id="tiersToggle" type="button" aria-pressed="false">
          <span class="box" aria-hidden="true"></span><span>Show skill levels</span>
        </button>
      </div>
    </div>
  </section>


</div>

<script src="assets/server-config.js"></script>
<script src="assets/engine.js?v=77"></script>
<script src="assets/auth-config.js"></script>
<script src="assets/auth.js?v=3"></script>
<script src="assets/preview-mode.js?v=16"></script>
<script src="assets/navigation.js?v=8"></script>
<script src="assets/motion.js?v=102"></script>
<script src="assets/pwa.js"></script>
<script src="assets/sort.js?v=111"></script>
</body>
</html>
