<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membership &middot; FRISBEING UF</title>
<meta name="description" content="Manage the FRISBEING UF club roster.">
<meta name="theme-color" content="#0E2018">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/monogram.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/brand.css?v=196">
<link rel="stylesheet" href="assets/community.css?v=16">
</head>
<body>

<div class="wrap">

  <nav class="nav">
    <div class="mark">
      <img src="assets/monogram.png" alt="">
      <div class="mark-copy">
        <span>FRISBEING UF</span>
        <small class="mark-est">Est. 2022</small>
      </div>
    </div>
    <a class="lnk" href="index.html">Home</a>
    <a class="lnk" id="gameNav" href="sort.html">Game</a>
    <a class="lnk" id="membershipNav" href="roster.html" aria-current="page" hidden>Member</a>
    <a class="lnk" id="accountNav" href="admin.html">Account</a><div class="nav-member-tools" id="memberTools" hidden><a class="lnk" href="gearhub.html">GearHub</a><a class="lnk" href="fris-off-school.html">Fris Off School</a></div>
  </nav>

  <section class="band-field membership-list-band">
    <div class="inner">
      <div class="head membership-heading">
        <h2 class="display" id="squadHeading">Nobody yet</h2>
      </div>
      <div class="roster-filters admin-only" id="rosterFilters" role="group" aria-label="Filter and sort members">
        <button type="button" data-tier-filter="all" aria-pressed="true">All</button>
        <button type="button" data-tier-filter="tier">By tier</button>
        <button type="button" data-tier-filter="A">T1</button>
        <button type="button" data-tier-filter="I">T2</button>
        <button type="button" data-tier-filter="B">T3</button>
        <button type="button" data-tier-filter="U">T4</button>
        <button type="button" data-tier-filter="attendance">By attendance</button>
        <button type="button" id="refreshMemberOrder">Refresh list</button>
      </div>
      <div class="member-list" id="memberList"></div>
      <section class="panel admin-only existing-teams-panel" id="existingTeamsPanel" hidden aria-labelledby="existingTeamsHeading">
        <div class="panel-hd">
          <h3 id="existingTeamsHeading">Existing teams</h3>
          <button class="btn" id="refreshExistingTeams" type="button"><span>Refresh</span></button>
        </div>
        <div class="existing-teams-list" id="existingTeamsList" aria-live="polite"></div>
        <div class="report" id="existingTeamsReport"></div>
      </section>
      <div class="report" id="unpublished" hidden></div>
    </div>
  </section>

  <section class="band-pitch membership-admin-band">
    <div class="inner">
      <div class="panel admin-only">
        <div class="panel-hd"><h3>Add one member</h3></div>
        <div class="row add-member-row" style="margin-top:0">
          <input type="text" id="oneName" placeholder="Name" style="flex:1 1 200px;width:auto">
          <div class="modes" id="onePosition" role="group" aria-label="Position"></div>
          <div class="modes" id="oneGender" role="group" aria-label="Gender (optional)"></div>
          <div class="modes" id="oneTier" role="group" aria-label="Tier"></div>
          <button class="btn solid" id="addOne" type="button"><span>Add</span></button>
        </div>
        <div class="report" id="addReport"></div>
      </div>

      <div class="panel admin-only">
        <div class="panel-hd">
          <h3>Paste the whole roster</h3>
        </div>
        <textarea id="rosterInput" rows="10" spellcheck="false"
          placeholder="Harry Xu_boy_T1&#10;Cindy Lin_girl_T2&#10;Leo Zeng_boy_T3"></textarea>
        <div class="row">
          <button class="btn solid" id="saveRoster" type="button"><span>Save roster</span></button>
          <button class="btn" id="loadCurrent" type="button"><span>Load current</span></button>
        </div>
        <div class="report" id="rosterReport"></div>
      </div>

      <div class="panel" id="accountsPanel" hidden>
        <div class="panel-hd">
          <h3>Accounts</h3>
        </div>
        <div class="member-list" id="accountList"></div>
        <div class="report" id="accountsReport"></div>
      </div>
    </div>
  </section>


</div>

<script src="assets/server-config.js"></script>
<script src="assets/engine.js?v=83"></script>
<script src="assets/store.js?v=91"></script>
<script src="assets/auth-config.js"></script>
<script src="assets/auth.js?v=3"></script>
<script src="assets/teammate-rules.js?v=2"></script>
<script src="assets/attendance-awards.js?v=1"></script>
<script src="assets/preview-mode.js?v=39"></script>
<script src="assets/navigation.js?v=23"></script>
<script src="assets/motion.js?v=104"></script>
<script src="assets/pwa.js?v=2"></script>
<script src="assets/roster.js?v=91"></script>
<script src="assets/accounts.js?v=3"></script>
</body>
</html>
